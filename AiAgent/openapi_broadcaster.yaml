openapi: 3.0.3
info:
  title: Cluster Status Broadcaster API
  description: |
    集群状态播报员工具接口，供 Dify/Coze/FastGPT 等智能体平台调用。

    ## 核心能力
    - **定时触发**: 支持定时器触发，自动查询集群各服务健康状态
    - **结构化报告**: 以标准化 Markdown/JSON 格式推送运维报告
    - **多通道推送**: 支持钉钉、企业微信、飞书、Slack、Email 等

    ## 工具设计思路
    - 每个工具对应一个原子能力，输入/输出均为 LLM 友好格式
    - 优先使用结构化 JSON 返回，便于 LLM 解析
    - 错误信息包含诊断建议，降低 LLM 推理成本
  version: 1.0.0
  contact:
    name: DevOps Team
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: 本地开发服务器

paths:
  /api/broadcast/cluster-status:
    get:
      operationId: get_cluster_status_report
      summary: 获取集群状态播报报告
      description: |
        查询 Prometheus 获取集群整体健康状态，生成结构化播报报告。
        报告包含：节点状态、Pod 分布、资源使用率、服务健康、异常告警。
      tags:
        - Broadcaster
      parameters:
        - name: namespace
          in: query
          description: Kubernetes 命名空间（为空则查询所有命名空间）
          schema:
            type: string
            default: ""
        - name: time_range_minutes
          in: query
          description: 统计时间窗口（分钟）
          schema:
            type: integer
            default: 30
            minimum: 5
            maximum: 1440
        - name: include_anomalies
          in: query
          description: 是否包含异常检测结果
          schema:
            type: boolean
            default: true
        - name: format
          in: query
          description: 报告输出格式
          schema:
            type: string
            enum: [markdown, json, html]
            default: markdown
      responses:
        "200":
          description: 集群状态报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatusReport"
            text/markdown:
              schema:
                type: string
            text/html:
              schema:
                type: string

  /api/broadcast/health-check:
    get:
      operationId: health_check
      summary: 服务健康检查
      description: 检查播报员服务自身状态
      tags:
        - Broadcaster
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/broadcast/trigger:
    post:
      operationId: trigger_broadcast
      summary: 手动触发播报
      description: 手动触发一次完整的集群状态播报流程
      tags:
        - Broadcaster
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastTriggerRequest"
      responses:
        "200":
          description: 播报触发成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastTriggerResponse"

  /api/broadcast/prometheus/query:
    get:
      operationId: prometheus_query
      summary: 执行 Prometheus 查询
      description: |
        直接查询 Prometheus，用于智能体平台自定义监控查询。
        LLM 应优先使用此工具而非原始 PromQL，以获得格式化结果。
      tags:
        - Prometheus
      parameters:
        - name: query
          in: query
          description: PromQL 查询语句
          schema:
            type: string
          required: true
        - name: type
          in: query
          description: 查询类型
          schema:
            type: string
            enum: [instant, range]
            default: instant
        - name: duration
          in: query
          description: range 查询的时间范围（分钟），仅 type=range 时生效
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusQueryResult"

  /api/broadcast/prometheus/pod-metrics:
    get:
      operationId: get_pod_metrics
      summary: 获取 Pod 资源指标
      description: |
        获取指定命名空间下所有 Pod 的 CPU 和内存使用情况。
        替代直接写 PromQL，LLM 可直接调用此工具。
      tags:
        - Prometheus
      parameters:
        - name: namespace
          in: query
          description: Kubernetes 命名空间
          schema:
            type: string
            default: default
        - name: metric_type
          in: query
          description: 指标类型
          schema:
            type: string
            enum: [cpu, memory, all]
            default: all
      responses:
        "200":
          description: Pod 指标数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodMetricsResponse"

  /api/broadcast/prometheus/node-status:
    get:
      operationId: get_node_status
      summary: 获取节点状态
      description: 获取集群所有节点的资源使用情况
      tags:
        - Prometheus
      responses:
        "200":
          description: 节点状态数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeStatusResponse"

  /api/broadcast/report/push:
    post:
      operationId: push_report
      summary: 推送报告到指定渠道
      description: |
        将播报报告推送到指定的通知渠道。
        支持钉钉、企业微信、飞书、Webhook。
      tags:
        - Push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushReportRequest"
      responses:
        "200":
          description: 推送结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"

components:
  schemas:
    ClusterStatusReport:
      type: object
      required:
        - report_id
        - timestamp
        - summary
      properties:
        report_id:
          type: string
          description: 报告唯一标识
          example: "rpt_20250604_193000"
        timestamp:
          type: string
          format: date-time
          description: 报告生成时间
        duration_minutes:
          type: integer
          description: 统计时间窗口
        summary:
          $ref: "#/components/schemas/ClusterSummary"
        namespaces:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceStatus"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
        anomalies:
          type: array
          description: 检测到的异常项
          items:
            $ref: "#/components/schemas/Anomaly"
        raw_markdown:
          type: string
          description: Markdown 格式的完整报告（便于直接推送）
        raw_html:
          type: string
          description: HTML 格式的完整报告

    ClusterSummary:
      type: object
      description: 集群整体健康摘要
      properties:
        total_nodes:
          type: integer
          description: 节点总数
        healthy_nodes:
          type: integer
          description: 健康节点数
        total_pods:
          type: integer
          description: Pod 总数
        running_pods:
          type: integer
          description: 运行中 Pod 数
        failed_pods:
          type: integer
          description: 失败 Pod 数
        pending_pods:
          type: integer
          description: Pending Pod 数
        cluster_health:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: 集群整体健康状态
        avg_cpu_usage_percent:
          type: number
          format: float
          description: 平均 CPU 使用率（%）
        avg_memory_usage_percent:
          type: number
          format: float
          description: 平均内存使用率（%）

    NamespaceStatus:
      type: object
      properties:
        namespace:
          type: string
        pod_count:
          type: integer
        healthy_pods:
          type: integer
        cpu_usage_avg:
          type: number
          format: float
        memory_usage_avg:
          type: number
          format: float

    ServiceHealth:
      type: object
      description: 服务健康状态
      properties:
        service_name:
          type: string
        namespace:
          type: string
        status:
          type: string
          enum: [healthy, degraded, down]
        pod_count:
          type: integer
        cpu_usage:
          type: number
          format: float
        memory_usage:
          type: number
          format: float
        request_rate:
          type: number
          format: float
          description: QPS
        error_rate:
          type: number
          format: float
          description: 错误率
        latency_p99_ms:
          type: number
          format: float
          description: P99 延迟（毫秒）

    Anomaly:
      type: object
      description: 检测到的异常
      properties:
        severity:
          type: string
          enum: [info, warning, critical]
        type:
          type: string
          description: 异常类型
          example: "high_cpu_usage"
        resource:
          type: string
          description: 涉及的资源
          example: "pod/reviews-v1-abc123"
        current_value:
          type: number
          format: float
        threshold:
          type: number
          format: float
        message:
          type: string
          description: 人类可读的异常描述
        suggestion:
          type: string
          description: 建议的处理方式

    PrometheusQueryResult:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        result_type:
          type: string
          description: vector / matrix / scalar
        formatted:
          type: string
          description: 格式化后的可读结果
        raw:
          type: object
          description: Prometheus 原始响应

    PodMetricsResponse:
      type: object
      properties:
        namespace:
          type: string
        timestamp:
          type: string
          format: date-time
        pods:
          type: array
          items:
            type: object
            properties:
              pod_name:
                type: string
              cpu_cores:
                type: number
                format: float
              memory_mib:
                type: number
                format: float
              status:
                type: string
                enum: [Running, Pending, Failed, Unknown]
              restarts:
                type: integer

    NodeStatusResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              node_name:
                type: string
              status:
                type: string
                enum: [Ready, NotReady, Unknown]
              cpu_cores_allocatable:
                type: number
              memory_bytes_allocatable:
                type: number
              cpu_usage_percent:
                type: number
              memory_usage_percent:
                type: number

    BroadcastTriggerRequest:
      type: object
      properties:
        namespace:
          type: string
        time_range_minutes:
          type: integer
          default: 30
        push_channels:
          type: array
          description: 推送渠道列表
          items:
            type: string
            enum: [dingtalk, feishu, webhook, slack, email]
        include_anomalies:
          type: boolean
          default: true

    BroadcastTriggerResponse:
      type: object
      properties:
        success:
          type: boolean
        report_id:
          type: string
        push_results:
          type: array
          items:
            $ref: "#/components/schemas/PushResult"
        message:
          type: string

    PushReportRequest:
      type: object
      required:
        - channel
        - content
      properties:
        channel:
          type: string
          enum: [dingtalk, feishu, webhook, slack, email]
          description: 推送渠道
        content:
          type: string
          description: 推送内容（Markdown 或纯文本）
        title:
          type: string
          description: 推送标题
        webhook_url:
          type: string
          description: Webhook 地址（channel=webhook 时必填）
        at_mobiles:
          type: array
          description: 钉钉/飞书 @ 手机号列表
          items:
            type: string

    PushResult:
      type: object
      properties:
        channel:
          type: string
        success:
          type: boolean
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            prometheus:
              type: string
              enum: [connected, disconnected]
            kubernetes:
              type: string
              enum: [connected, disconnected]
